<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> Lista de Posts </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!--<p style="color: red; font-size: 24px">
    Cantidad de posts: {{ posts.length }}
  </p>-->
  <ion-list>
    <ion-item *ngFor="let post of posts">
      <ion-label>
        <h2>{{ post.title }}</h2>
        <p>{{ post.body }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
